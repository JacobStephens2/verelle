<VirtualHost *:80>
    ServerName verelle.app
    ServerAlias www.verelle.app
    DocumentRoot /var/www/verelle.app/current

    <Directory /var/www/verelle.app/current>
        Options -Indexes +FollowSymLinks
        AllowOverride None
        Require all granted

        # Return the application shell for browser-routed paths.
        FallbackResource /index.html
    </Directory>

    AddType application/wasm .wasm

    # Keep the reviewed API same-origin. Axum remains loopback-only.
    ProxyRequests Off
    ProxyPreserveHost On
    ProxyPass        /api/v1 http://127.0.0.1:3035/api/v1 retry=0 connectiontimeout=5 timeout=15
    ProxyPassReverse /api/v1 http://127.0.0.1:3035/api/v1
    <Location "/api/v1/">
        LimitRequestBody 1500000
    </Location>

    <IfModule mod_headers.c>
        Header always set Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval' 'sha256-kMfbqVQnI3j26VQ2IC5BkEpx6ryEfNVHn7Z8OM+ppC8='; style-src 'self'; img-src 'self' data:; connect-src 'self'; font-src 'self'; object-src 'none'; base-uri 'none'; frame-ancestors 'none'; form-action 'self'; upgrade-insecure-requests"
        Header always set Cross-Origin-Opener-Policy "same-origin"
        Header always set Cross-Origin-Resource-Policy "same-origin"
        Header always set Permissions-Policy "camera=(), microphone=(), geolocation=()"
        Header always set Referrer-Policy "no-referrer"
        Header always set X-Content-Type-Options "nosniff"
        Header always set X-Frame-Options "DENY"

        <FilesMatch "\.(css|js|wasm)$">
            Header set Cache-Control "public, max-age=31536000, immutable"
        </FilesMatch>

        <LocationMatch "^/snippets/">
            Header set Cache-Control "no-cache, no-store, must-revalidate"
        </LocationMatch>

        <FilesMatch "^(index|consumer-health-data-privacy)\.html$">
            Header set Cache-Control "no-cache, no-store, must-revalidate"
        </FilesMatch>
    </IfModule>

    ErrorLog ${APACHE_LOG_DIR}/verelle.app-error.log
    CustomLog ${APACHE_LOG_DIR}/verelle.app-access.log combined

    RewriteEngine On
    RewriteCond %{HTTP_HOST} ^www\.verelle\.app(?::\d+)?$ [NC]
    RewriteRule ^ https://www.verelle.app%{REQUEST_URI} [END,NE,R=permanent]
    RewriteRule ^ https://verelle.app%{REQUEST_URI} [END,NE,R=permanent]
</VirtualHost>
