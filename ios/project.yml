name: Verelle
options:
  bundleIdPrefix: app.verelle
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    DEVELOPMENT_TEAM: ""
    CODE_SIGNING_ALLOWED: NO
targets:
  Verelle:
    type: application
    platform: iOS
    sources:
      - path: Verelle
      - path: Generated/verelle_ffi.swift
    dependencies:
      - framework: Generated/VerelleFFI.xcframework
        embed: false
      - target: VerelleWatch
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.verelle.mobile
        ARCHS: arm64
        PRODUCT_NAME: Verelle
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Verelle
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        TARGETED_DEVICE_FAMILY: "1"
        OTHER_LDFLAGS:
          - $(inherited)
          - -lz
          - -framework
          - Security
  VerelleWatch:
    type: application
    platform: watchOS
    deploymentTarget: "10.0"
    sources:
      - VerelleWatch
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.verelle.mobile.watchkitapp
        PRODUCT_NAME: Verelle Watch
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Verelle
        INFOPLIST_KEY_WKCompanionAppBundleIdentifier: app.verelle.mobile
        SKIP_INSTALL: YES
  VerelleTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - VerelleTests
    dependencies:
      - target: Verelle
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.verelle.mobile.tests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Verelle:
    build:
      targets:
        Verelle: all
        VerelleWatch: all
        VerelleTests: [test]
    test:
      targets:
        - VerelleTests
