[package]
name = "verelle-web"
description = "Leptos browser shell for Verelle"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[dependencies]
base64.workspace = true
chrono.workspace = true
console_error_panic_hook = "0.1"
getrandom = { version = "0.2", features = ["js"] }
js-sys = "0.3"
leptos = { workspace = true, features = ["csr"] }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
uuid = { workspace = true, features = ["js"] }
verelle-api = { path = "../verelle-api" }
verelle-auth = { path = "../verelle-auth" }
verelle-core = { path = "../verelle-core" }
verelle-crypto = { path = "../verelle-crypto" }
verelle-sync = { path = "../verelle-sync" }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["Headers", "Request", "RequestInit", "RequestMode", "Response", "Storage", "Window"] }
zeroize.workspace = true

[lints]
workspace = true
