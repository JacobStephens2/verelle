<!doctype html>
<!--
  PROTOTYPE — throwaway, memory-only, and intentionally outside the production build.
  Question: What is the lightest-weight interface that still feels like Verelle?
  Three variants of Verelle's record-and-display loop, switchable via ?variant= on this page.
  Run: ./scripts/prototype-simplest.sh
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Verelle — simplest possible prototype</title>
    <style>
      :root {
        color-scheme: light;
        --ink: #19353b;
        --muted: #687c80;
        --teal: #1f6570;
        --deep: #123f48;
        --mist: #eaf3f1;
        --paper: #fffefb;
        --line: rgba(25, 53, 59, 0.13);
        --low: #7ea7c0;
        --high: #d5a345;
        --peak: #ca755f;
        --missed: #a2aaa8;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        font-synthesis: none;
      }

      * { box-sizing: border-box; }
      html { min-width: 320px; }
      body { margin: 0; min-height: 100vh; color: var(--ink); background: #f4f6f2; }
      button, input { font: inherit; }
      button { cursor: pointer; }
      button:focus-visible, input:focus-visible { outline: 3px solid rgba(31, 101, 112, 0.28); outline-offset: 2px; }
      h1, h2, h3, p { margin-top: 0; }
      h1, h2, h3, .brand { font-family: "Iowan Old Style", "Palatino Linotype", Georgia, serif; }

      .prototype-note {
        position: fixed;
        z-index: 30;
        top: 12px;
        left: 50%;
        translate: -50% 0;
        margin: 0;
        border: 1px solid rgba(255, 255, 255, 0.3);
        border-radius: 999px;
        padding: 7px 12px;
        color: white;
        background: rgba(18, 36, 40, 0.86);
        backdrop-filter: blur(10px);
        font-size: 0.67rem;
        font-weight: 750;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      .brand { display: inline-flex; align-items: center; gap: 9px; color: var(--deep); font-size: 1.35rem; font-weight: 650; }
      .brand-mark { width: 30px; height: 30px; display: grid; place-items: center; border-radius: 48% 52% 43% 57%; color: white; background: var(--teal); font: 750 0.78rem/1 ui-sans-serif, system-ui; transform: rotate(-6deg); }
      .eyebrow { margin-bottom: 8px; color: var(--teal); font-size: 0.67rem; font-weight: 800; letter-spacing: 0.13em; text-transform: uppercase; }
      .muted { color: var(--muted); }
      .tiny { font-size: 0.72rem; }
      .reading-dot { width: 10px; height: 10px; display: inline-block; border-radius: 50%; background: var(--reading-color, var(--missed)); }
      .reading-dot.low, .reading-fill.low { --reading-color: var(--low); }
      .reading-dot.high, .reading-fill.high { --reading-color: var(--high); }
      .reading-dot.peak, .reading-fill.peak { --reading-color: var(--peak); }
      .reading-dot.missed, .reading-fill.missed { --reading-color: var(--missed); }

      .primary {
        border: 0;
        border-radius: 13px;
        padding: 14px 18px;
        color: white;
        background: var(--deep);
        font-weight: 750;
        box-shadow: 0 9px 24px rgba(18, 63, 72, 0.16);
      }
      .primary:hover { background: var(--teal); }

      .state-panel {
        position: relative;
        z-index: 20;
        width: min(1180px, calc(100vw - 28px));
        margin: 18px auto 80px;
        border: 1px dashed rgba(25, 53, 59, 0.3);
        border-radius: 12px;
        padding: 10px 12px;
        background: rgba(255, 254, 251, 0.94);
        box-shadow: 0 8px 30px rgba(25, 53, 59, 0.1);
        backdrop-filter: blur(10px);
      }
      .state-panel strong { display: block; margin-bottom: 5px; font-size: 0.65rem; letter-spacing: 0.08em; text-transform: uppercase; }
      .state-panel pre { overflow: hidden; margin: 0; color: #52666a; font: 0.65rem/1.45 ui-monospace, SFMono-Regular, Menlo, monospace; white-space: pre-wrap; }

      .prototype-switcher {
        position: fixed;
        z-index: 40;
        left: 50%;
        bottom: 14px;
        translate: -50% 0;
        display: grid;
        grid-template-columns: 40px minmax(190px, auto) 40px;
        align-items: center;
        overflow: hidden;
        border: 1px solid rgba(255, 255, 255, 0.22);
        border-radius: 999px;
        color: white;
        background: #152d32;
        box-shadow: 0 12px 40px rgba(18, 45, 50, 0.25);
      }
      .prototype-switcher button { height: 42px; border: 0; color: inherit; background: transparent; font-size: 1.15rem; }
      .prototype-switcher button:hover { background: rgba(255, 255, 255, 0.1); }
      .prototype-label { padding: 0 12px; font-size: 0.72rem; font-weight: 750; text-align: center; }

      /* Variant A — the entire product is today's one action, with history demoted. */
      .variant-a { min-height: 100vh; padding: 74px 24px 150px; background: radial-gradient(circle at 50% -10%, #dceceb, transparent 36rem), #f7f5ed; }
      .a-header { width: min(880px, 100%); display: flex; align-items: center; justify-content: space-between; margin: 0 auto 48px; }
      .local-mode { display: inline-flex; align-items: center; gap: 7px; color: var(--muted); font-size: 0.72rem; font-weight: 700; }
      .local-mode::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: #4e9a77; box-shadow: 0 0 0 4px rgba(78, 154, 119, 0.13); }
      .a-main { width: min(880px, 100%); margin: 0 auto; }
      .a-intro { display: flex; align-items: end; justify-content: space-between; gap: 30px; margin-bottom: 18px; }
      .a-intro h1 { margin-bottom: 5px; font-size: clamp(2.5rem, 7vw, 4.7rem); font-weight: 520; letter-spacing: -0.045em; line-height: 0.95; }
      .cycle-label { min-width: 110px; color: var(--muted); font-size: 0.73rem; text-align: right; }
      .cycle-label strong { display: block; margin-top: 4px; color: var(--ink); font-size: 1rem; }
      .today-card { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 34px; align-items: center; border: 1px solid var(--line); border-radius: 26px; padding: clamp(25px, 5vw, 45px); background: rgba(255, 254, 251, 0.9); box-shadow: 0 22px 70px rgba(25, 53, 59, 0.11); }
      .today-card h2 { margin-bottom: 10px; font-size: clamp(1.65rem, 4vw, 2.3rem); font-weight: 600; }
      .reading-choices { display: grid; grid-template-columns: repeat(4, 1fr); gap: 9px; margin-top: 25px; }
      .reading-choice { min-height: 76px; display: grid; place-items: center; gap: 4px; border: 1px solid var(--line); border-radius: 14px; color: var(--muted); background: white; font-size: 0.73rem; font-weight: 760; }
      .reading-choice .reading-dot { width: 15px; height: 15px; }
      .reading-choice:hover, .reading-choice.selected { border-color: var(--reading-color); color: var(--ink); background: color-mix(in srgb, var(--reading-color) 13%, white); box-shadow: inset 0 0 0 1px var(--reading-color); }
      .save-wrap { display: grid; gap: 10px; min-width: 150px; }
      .save-wrap .primary { min-height: 104px; font-size: 0.84rem; }
      .save-wrap span { max-width: 150px; color: var(--muted); font-size: 0.66rem; line-height: 1.45; text-align: center; }
      .a-history { margin-top: 26px; }
      .a-history-head { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 10px; }
      .a-history-head h3 { margin: 0; font-size: 1.15rem; }
      .day-strip { display: grid; grid-template-columns: repeat(11, 1fr); overflow: hidden; border: 1px solid var(--line); border-radius: 16px; background: var(--paper); }
      .strip-day { min-height: 74px; display: grid; place-items: center; gap: 5px; border: 0; border-right: 1px solid var(--line); color: var(--muted); background: transparent; font-size: 0.64rem; }
      .strip-day:last-child { border-right: 0; }
      .strip-day strong { color: var(--ink); font-size: 0.8rem; }
      .strip-day.selected { background: var(--mist); box-shadow: inset 0 -3px var(--teal); }

      /* Variant B — the chart is the product; recording is a narrow tool beside it. */
      .variant-b { min-height: 100vh; padding: 75px 28px 155px; background: #eef2f0; }
      .b-shell { width: min(1180px, 100%); margin: 0 auto; border: 1px solid var(--line); border-radius: 22px; background: var(--paper); box-shadow: 0 18px 60px rgba(25, 53, 59, 0.09); }
      .b-header { min-height: 72px; display: flex; align-items: center; justify-content: space-between; gap: 20px; border-bottom: 1px solid var(--line); padding: 16px 24px; }
      .b-header-meta { display: flex; align-items: center; gap: 22px; color: var(--muted); font-size: 0.7rem; }
      .b-header-meta strong { display: block; margin-top: 3px; color: var(--ink); font-size: 0.82rem; }
      .b-workspace { display: grid; grid-template-columns: minmax(0, 1fr) 290px; min-height: 580px; }
      .chart-first { min-width: 0; padding: 30px; border-right: 1px solid var(--line); }
      .chart-first-head { display: flex; align-items: end; justify-content: space-between; gap: 18px; margin-bottom: 25px; }
      .chart-first-head h1 { margin-bottom: 3px; font-size: 2.2rem; font-weight: 580; }
      .chart-legend { display: flex; gap: 12px; color: var(--muted); font-size: 0.66rem; }
      .chart-legend span { display: inline-flex; align-items: center; gap: 5px; }
      .chart-grid { display: grid; grid-template-columns: repeat(6, minmax(86px, 1fr)); gap: 8px; }
      .chart-day { position: relative; min-height: 125px; display: grid; align-content: space-between; border: 1px solid var(--line); border-radius: 12px; padding: 12px; color: var(--ink); background: white; text-align: left; }
      .chart-day:hover, .chart-day.selected { border-color: var(--teal); box-shadow: inset 0 0 0 1px var(--teal); }
      .chart-day.today::after { content: "Today"; position: absolute; top: 10px; right: 10px; color: var(--teal); font-size: 0.55rem; font-weight: 800; text-transform: uppercase; }
      .chart-day-num { color: var(--muted); font-size: 0.62rem; }
      .chart-day-num strong { display: block; color: var(--ink); font: 600 1.35rem/1.1 "Iowan Old Style", Georgia, serif; }
      .chart-reading { display: flex; align-items: center; gap: 7px; font-size: 0.68rem; font-weight: 750; }
      .record-tray { padding: 30px 24px; background: #f8f6ef; }
      .record-tray h2 { margin-bottom: 7px; font-size: 1.55rem; }
      .tray-choices { display: grid; gap: 8px; margin: 24px 0 18px; }
      .tray-choice { display: flex; align-items: center; gap: 10px; border: 1px solid var(--line); border-radius: 11px; padding: 12px; color: var(--muted); background: white; font-size: 0.73rem; font-weight: 750; text-align: left; }
      .tray-choice.selected { border-color: var(--reading-color); color: var(--ink); box-shadow: inset 3px 0 var(--reading-color); }
      .record-tray .primary { width: 100%; }

      /* Variant C — recording is a guided check-in; the chart becomes a quiet recap. */
      .variant-c { min-height: 100vh; display: grid; place-items: start center; padding: 70px 24px 165px; background: linear-gradient(135deg, #183f47 0%, #255e65 52%, #dce8e4 52%, #f4f0e7 100%); }
      .c-shell { width: min(960px, 100%); display: grid; grid-template-columns: minmax(310px, 0.88fr) minmax(390px, 1.12fr); overflow: hidden; border-radius: 28px; background: var(--paper); box-shadow: 0 30px 90px rgba(7, 33, 38, 0.28); }
      .c-recap { padding: 40px; color: white; background: var(--deep); }
      .c-recap .brand { color: white; }
      .c-recap .brand-mark { color: var(--deep); background: white; }
      .c-recap h2 { margin: 60px 0 10px; font-size: 2rem; font-weight: 560; }
      .c-recap > p { color: #bdd3d4; font-size: 0.8rem; line-height: 1.6; }
      .recap-list { display: grid; gap: 1px; overflow: hidden; margin-top: 25px; border: 1px solid rgba(255,255,255,0.13); border-radius: 13px; background: rgba(255,255,255,0.13); }
      .recap-row { display: grid; grid-template-columns: 46px 1fr auto; align-items: center; gap: 9px; padding: 11px 13px; background: rgba(255,255,255,0.05); font-size: 0.67rem; }
      .recap-row strong { font-size: 0.75rem; }
      .recap-row span:last-child { color: #c7d9da; }
      .c-checkin { padding: 45px clamp(28px, 6vw, 60px); }
      .checkin-progress { display: flex; gap: 6px; margin-bottom: 42px; }
      .checkin-progress i { width: 34px; height: 4px; border-radius: 99px; background: #dbe5e2; }
      .checkin-progress i.active { background: var(--teal); }
      .c-checkin h1 { margin-bottom: 10px; font-size: clamp(2.1rem, 5vw, 3.1rem); font-weight: 550; letter-spacing: -0.035em; line-height: 1; }
      .checkin-choices { display: grid; gap: 10px; margin: 30px 0 20px; }
      .checkin-choice { min-height: 58px; display: grid; grid-template-columns: 18px 1fr auto; align-items: center; gap: 12px; border: 1px solid var(--line); border-radius: 14px; padding: 13px 15px; color: var(--ink); background: white; font-size: 0.78rem; font-weight: 780; text-align: left; }
      .checkin-choice small { color: var(--muted); font-weight: 500; }
      .checkin-choice.selected { border-color: var(--reading-color); background: color-mix(in srgb, var(--reading-color) 10%, white); box-shadow: inset 0 0 0 1px var(--reading-color); }
      .checkin-actions { display: flex; align-items: center; justify-content: space-between; gap: 14px; }
      .checkin-actions span { color: var(--muted); font-size: 0.66rem; line-height: 1.4; }

      .toast { position: fixed; z-index: 50; top: 54px; left: 50%; translate: -50% -10px; border-radius: 999px; padding: 9px 14px; color: white; background: #347a60; box-shadow: 0 8px 28px rgba(18, 63, 72, 0.2); font-size: 0.72rem; font-weight: 750; opacity: 0; pointer-events: none; transition: 160ms ease; }
      .toast.visible { translate: -50% 0; opacity: 1; }

      @media (max-width: 900px) {
        .chart-grid { grid-template-columns: repeat(4, minmax(82px, 1fr)); }
        .b-workspace { grid-template-columns: 1fr; }
        .chart-first { border-right: 0; border-bottom: 1px solid var(--line); }
        .record-tray { display: grid; grid-template-columns: 1fr 1.2fr auto; align-items: end; gap: 18px; }
        .record-tray .tray-choices { grid-template-columns: repeat(2, 1fr); margin: 0; }
        .record-tray .primary { width: auto; height: 48px; }
        .c-shell { grid-template-columns: 1fr; }
        .c-recap { display: none; }
      }

      @media (max-width: 680px) {
        .prototype-note { max-width: calc(100vw - 24px); overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
        .state-panel { width: auto; margin: 20px 14px 80px; }
        .variant-a, .variant-b, .variant-c { padding-left: 14px; padding-right: 14px; padding-bottom: 30px; }
        .a-header { margin-bottom: 32px; }
        .a-intro { align-items: start; }
        .today-card { grid-template-columns: 1fr; gap: 22px; }
        .reading-choices { grid-template-columns: repeat(2, 1fr); }
        .save-wrap { grid-template-columns: 1fr; }
        .save-wrap .primary { min-height: 52px; }
        .day-strip { grid-template-columns: repeat(6, 1fr); }
        .strip-day:nth-child(6) { border-right: 0; }
        .strip-day:nth-child(n+7) { border-top: 1px solid var(--line); }
        .chart-grid { grid-template-columns: repeat(2, minmax(100px, 1fr)); }
        .chart-first { padding: 23px 17px; }
        .chart-first-head { display: block; }
        .chart-legend { margin-top: 12px; }
        .record-tray { display: block; }
        .record-tray .tray-choices { display: grid; grid-template-columns: repeat(2, 1fr); margin: 20px 0 16px; }
        .record-tray .primary { width: 100%; }
        .b-header-meta { display: none; }
        .c-checkin { padding: 40px 24px; }
        .prototype-switcher { grid-template-columns: 40px minmax(170px, auto) 40px; }
      }
    </style>
  </head>
  <body>
    <p class="prototype-note">Prototype · memory only · no fertility interpretation</p>
    <div id="app"></div>
    <aside class="state-panel" aria-label="Full prototype state">
      <strong>Prototype state</strong>
      <pre id="state-output"></pre>
    </aside>
    <nav class="prototype-switcher" aria-label="Prototype variants">
      <button id="previous-variant" type="button" aria-label="Previous variant">←</button>
      <span class="prototype-label" id="variant-label"></span>
      <button id="next-variant" type="button" aria-label="Next variant">→</button>
    </nav>
    <div class="toast" id="toast" role="status">Observation saved in memory</div>

    <script>
      const variants = [
        { key: "A", name: "One daily action" },
        { key: "B", name: "Chart first" },
        { key: "C", name: "Guided check-in" },
      ];

      const state = {
        variant: "A",
        cycle: 3,
        selectedDay: 11,
        draft: "High",
        records: ["Low", "Low", "Low", "High", "High", "Peak", "High", "Low", "Low", "Missed", null],
      };

      const app = document.querySelector("#app");
      const stateOutput = document.querySelector("#state-output");
      const variantLabel = document.querySelector("#variant-label");
      const toast = document.querySelector("#toast");
      let toastTimer;

      function requestedVariant() {
        const key = new URLSearchParams(location.search).get("variant")?.toUpperCase();
        return variants.some((variant) => variant.key === key) ? key : "A";
      }

      function readingClass(reading) {
        return (reading || "Missed").toLowerCase();
      }

      function dateForDay(day) {
        const date = new Date(2026, 6, 26 + day);
        return date.toLocaleDateString("en-US", { month: "short", day: "numeric" });
      }

      function choices(className) {
        return ["Low", "High", "Peak", "Missed"].map((reading) => `
          <button class="${className} reading-fill ${readingClass(reading)} ${state.draft === reading ? "selected" : ""}" type="button" data-reading="${reading}">
            <i class="reading-dot ${readingClass(reading)}"></i>
            <span>${reading}</span>
            ${className === "checkin-choice" ? `<small>${reading === "Missed" ? "No reading today" : "Monitor result"}</small>` : ""}
          </button>
        `).join("");
      }

      function stripDays() {
        return state.records.map((reading, index) => {
          const day = index + 1;
          return `
            <button class="strip-day ${state.selectedDay === day ? "selected" : ""}" type="button" data-day="${day}">
              <span>CD</span><strong>${day}</strong><i class="reading-dot ${readingClass(reading)}"></i>
            </button>
          `;
        }).join("");
      }

      function chartDays() {
        return state.records.map((reading, index) => {
          const day = index + 1;
          return `
            <button class="chart-day ${day === 11 ? "today" : ""} ${state.selectedDay === day ? "selected" : ""}" type="button" data-day="${day}">
              <span class="chart-day-num">Cycle day<strong>${day}</strong>${dateForDay(day)}</span>
              <span class="chart-reading"><i class="reading-dot ${readingClass(reading)}"></i>${reading || "No entry"}</span>
            </button>
          `;
        }).join("");
      }

      function recentRows() {
        return state.records.map((reading, index) => ({ reading, day: index + 1 })).filter((item) => item.reading).slice(-5).reverse().map((item) => `
          <div class="recap-row"><strong>CD ${item.day}</strong><span>${dateForDay(item.day)}</span><span>${item.reading}</span></div>
        `).join("");
      }

      function variantA() {
        return `
          <div class="variant-a">
            <header class="a-header"><span class="brand"><i class="brand-mark">V</i>Verelle</span><span class="local-mode">On this device</span></header>
            <main class="a-main">
              <div class="a-intro">
                <div><p class="eyebrow">Thursday, August 6</p><h1>Today</h1></div>
                <p class="cycle-label">Your chart<strong>Cycle 3 · day 11</strong></p>
              </div>
              <section class="today-card">
                <div>
                  <p class="eyebrow">Daily observation</p>
                  <h2>What did your monitor show?</h2>
                  <p class="muted tiny">Choose the result exactly as it appeared.</p>
                  <div class="reading-choices">${choices("reading-choice")}</div>
                </div>
                <div class="save-wrap">
                  <button class="primary" type="button" data-save>Save ${state.draft}</button>
                  <span>Verelle records what you enter. It does not interpret fertility.</span>
                </div>
              </section>
              <section class="a-history">
                <div class="a-history-head"><h3>This cycle</h3><span class="muted tiny">Tap a day to inspect it</span></div>
                <div class="day-strip">${stripDays()}</div>
              </section>
            </main>
          </div>
        `;
      }

      function variantB() {
        return `
          <div class="variant-b">
            <main class="b-shell">
              <header class="b-header">
                <span class="brand"><i class="brand-mark">V</i>Verelle</span>
                <div class="b-header-meta"><span>Cycle<strong>3</strong></span><span>Started<strong>July 27</strong></span><span>Recorded<strong>${state.records.filter(Boolean).length} of 11 days</strong></span></div>
              </header>
              <div class="b-workspace">
                <section class="chart-first">
                  <div class="chart-first-head">
                    <div><p class="eyebrow">Your record</p><h1>Cycle 3</h1><span class="muted tiny">Select any day to record or correct it.</span></div>
                    <div class="chart-legend"><span><i class="reading-dot low"></i>Low</span><span><i class="reading-dot high"></i>High</span><span><i class="reading-dot peak"></i>Peak</span></div>
                  </div>
                  <div class="chart-grid">${chartDays()}</div>
                </section>
                <aside class="record-tray">
                  <div><p class="eyebrow">Selected day</p><h2>Cycle day ${state.selectedDay}</h2><p class="muted tiny">${dateForDay(state.selectedDay)}</p></div>
                  <div class="tray-choices">${choices("tray-choice")}</div>
                  <button class="primary" type="button" data-save>Save result</button>
                </aside>
              </div>
            </main>
          </div>
        `;
      }

      function variantC() {
        return `
          <div class="variant-c">
            <main class="c-shell">
              <aside class="c-recap">
                <span class="brand"><i class="brand-mark">V</i>Verelle</span>
                <h2>Your recent entries</h2>
                <p>A quiet record of what you observed. No predictions or interpretations.</p>
                <div class="recap-list">${recentRows()}</div>
              </aside>
              <section class="c-checkin">
                <div class="checkin-progress" aria-label="Step 1 of 1"><i class="active"></i></div>
                <p class="eyebrow">Today · cycle day 11</p>
                <h1>Good evening.<br />What did you see?</h1>
                <p class="muted tiny">Choose the result shown by your monitor.</p>
                <div class="checkin-choices">${choices("checkin-choice")}</div>
                <div class="checkin-actions">
                  <span>Stored on this device<br />until you leave this prototype.</span>
                  <button class="primary" type="button" data-save>Finish check-in →</button>
                </div>
              </section>
            </main>
          </div>
        `;
      }

      function render() {
        state.variant = requestedVariant();
        const variant = variants.find((item) => item.key === state.variant);
        app.innerHTML = state.variant === "A" ? variantA() : state.variant === "B" ? variantB() : variantC();
        variantLabel.textContent = `${variant.key} — ${variant.name}`;
        stateOutput.textContent = JSON.stringify({
          variant: state.variant,
          cycle: state.cycle,
          selectedDay: state.selectedDay,
          draft: state.draft,
          records: state.records.map((reading, index) => `CD${index + 1}:${reading || "—"}`).join(" · "),
        }, null, 2);

        document.querySelectorAll("[data-reading]").forEach((button) => button.addEventListener("click", () => {
          state.draft = button.dataset.reading;
          render();
        }));

        document.querySelectorAll("[data-day]").forEach((button) => button.addEventListener("click", () => {
          state.selectedDay = Number(button.dataset.day);
          state.draft = state.records[state.selectedDay - 1] || "Low";
          render();
        }));

        document.querySelectorAll("[data-save]").forEach((button) => button.addEventListener("click", () => {
          state.records[state.selectedDay - 1] = state.draft;
          render();
          clearTimeout(toastTimer);
          toast.classList.add("visible");
          toastTimer = setTimeout(() => toast.classList.remove("visible"), 1600);
        }));
      }

      function cycleVariant(direction) {
        const current = variants.findIndex((variant) => variant.key === state.variant);
        const next = variants[(current + direction + variants.length) % variants.length];
        const url = new URL(location.href);
        url.searchParams.set("variant", next.key);
        history.replaceState({}, "", url);
        render();
      }

      document.querySelector("#previous-variant").addEventListener("click", () => cycleVariant(-1));
      document.querySelector("#next-variant").addEventListener("click", () => cycleVariant(1));
      addEventListener("popstate", render);
      addEventListener("keydown", (event) => {
        const target = event.target;
        if (target.matches("input, textarea, [contenteditable]")) return;
        if (event.key === "ArrowLeft") cycleVariant(-1);
        if (event.key === "ArrowRight") cycleVariant(1);
      });

      render();
    </script>
  </body>
</html>
