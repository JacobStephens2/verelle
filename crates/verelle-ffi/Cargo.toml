[package]
name = "verelle-ffi"
description = "Typed UniFFI boundary for Verelle native clients"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[lib]
name = "verelle_ffi"
crate-type = ["rlib", "staticlib", "cdylib"]

[[bin]]
name = "uniffi-bindgen"
path = "src/bin/uniffi-bindgen.rs"
required-features = ["cli"]

[features]
cli = ["uniffi/cli"]

[dependencies]
base64.workspace = true
chrono.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
uniffi.workspace = true
uuid.workspace = true
verelle-core = { path = "../verelle-core" }
verelle-api = { path = "../verelle-api" }
verelle-auth = { path = "../verelle-auth" }
verelle-crypto = { path = "../verelle-crypto" }
verelle-store = { path = "../verelle-store" }
verelle-sync = { path = "../verelle-sync" }

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
