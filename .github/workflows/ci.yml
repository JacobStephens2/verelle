name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - run: cargo run --locked -p verelle-cli -- validate-fixtures fixtures
      - name: Check declared Rust 1.88 minimum
        run: |
          rustup toolchain install 1.88.0 --profile minimal
          cargo +1.88.0 check --workspace --all-targets --locked

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
      - uses: gradle/actions/setup-gradle@v4
      - name: Install Android build dependencies
        run: |
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;28.2.13676358"
          cargo install cargo-ndk --version 4.1.2 --locked
      - name: Build app and device-test APKs
        working-directory: android
        run: >-
          ./gradlew --no-daemon
          testDebugUnitTest
          assembleDebug
          assembleDebugAndroidTest

  ios:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios,aarch64-apple-ios-sim
      - uses: Swatinem/rust-cache@v2
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Build the Rust XCFramework
        run: ./scripts/build-ios-ffi.sh
      - name: Generate and build the iPhone project
        working-directory: ios
        run: |
          xcodegen generate
          xcodebuild -project Verelle.xcodeproj -scheme Verelle \
            -destination 'generic/platform=iOS Simulator' \
            build CODE_SIGNING_ALLOWED=NO
