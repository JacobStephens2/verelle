name: ci

on:
  push:
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - "prototype/**"
  pull_request:
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - "prototype/**"

permissions:
  contents: read

jobs:
  web:
    name: Web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      # ADR 0010: the shells bundle their assets. `cap sync` regenerates the
      # native configs, and the guard fails the job if a `server` key appears
      # in either of them.
      - name: Sync native projects
        run: npx cap sync

      - name: Verify no server url reaches the native configs
        run: npm run verify:no-server-url

      - name: Browser smoke - empty chart
        env:
          VERELLE_CHROME_PATH: /usr/bin/google-chrome
        run: npm run smoke:empty-chart

  android:
    name: Android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4

      - run: npm ci
      - name: Build web assets into the shell
        run: |
          npm run build
          npx cap sync android

      - name: Build the debug APK
        working-directory: android
        run: ./gradlew --no-daemon assembleDebug

  ios:
    name: iOS
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - name: Build web assets into the shell
        run: |
          npm run build
          npx cap sync ios

      # Unsigned: CI proves the shell compiles for the simulator. Signed builds
      # happen at release time, not here.
      - name: Build for the simulator
        working-directory: ios/App
        run: |
          xcodebuild -scheme App \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build \
            build CODE_SIGNING_ALLOWED=NO

      # Compiling is not launching. The failure class this ticket's shell has
      # to stay clear of is an app that builds and then shows a blank WebView,
      # so boot a simulator and check the app is still alive after launch.
      - name: Launch on a simulator
        working-directory: ios/App
        run: |
          set -euo pipefail
          device=$(xcrun simctl create verelle-ci 'iPhone 16')
          xcrun simctl bootstatus "$device" -b
          xcrun simctl install "$device" \
            build/Build/Products/Debug-iphonesimulator/App.app
          # Capacitor bridges the WebView console to the app's stdout, not to
          # os_log, so the launch has to be attached to a pty to see it.
          xcrun simctl launch --console-pty "$device" app.verelle > app-console.txt 2>&1 &
          launch_pid=$!
          sleep 20
          xcrun simctl io "$device" screenshot verelle-launch.png

          # `launchctl list` inside the simulator: a crashed app is gone from
          # it. Checked before the pty is closed, because closing it takes the
          # app down with it.
          xcrun simctl spawn "$device" launchctl list | grep -q app.verelle \
            || { echo "FAIL: app.verelle is not running after launch"; cat app-console.txt; exit 1; }
          echo "ok: app.verelle still running after launch"
          kill "$launch_pid" 2>/dev/null || true

          # Alive is not painted, and a blank WebView passes an alive check.
          # The breadcrumb ChartFrame.vue logs on mount is what separates a
          # rendered Chart from a blank one.
          grep -q "verelle: chart frame painted, 42 cycle day columns" app-console.txt \
            || { echo "FAIL: the chart frame never reported painting"; cat app-console.txt; exit 1; }
          echo "ok: the chart frame painted 42 cycle day columns in the WebView"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-launch-screenshot
          path: ios/App/verelle-launch.png
          if-no-files-found: warn
