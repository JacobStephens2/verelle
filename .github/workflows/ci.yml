name: ci

on:
  push:
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - "prototype/**"
  pull_request:
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - "prototype/**"

permissions:
  contents: read

jobs:
  web:
    name: Web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      # ADR 0010: the shells bundle their assets. `cap sync` regenerates the
      # native configs, and the guard fails the job if a `server` key appears
      # in either of them.
      - name: Sync native projects
        run: npx cap sync

      - name: Verify no server url reaches the native configs
        run: npm run verify:no-server-url

      - name: Browser smoke — empty chart
        env:
          VERELLE_CHROME_PATH: /usr/bin/google-chrome
        run: npm run smoke:empty-chart

  android:
    name: Android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4

      - run: npm ci
      - name: Build web assets into the shell
        run: |
          npm run build
          npx cap sync android

      - name: Build the debug APK
        working-directory: android
        run: ./gradlew --no-daemon assembleDebug

  ios:
    name: iOS
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - name: Build web assets into the shell
        run: |
          npm run build
          npx cap sync ios

      # Unsigned: CI proves the shell compiles for the simulator. Signed builds
      # happen at release time, not here.
      - name: Build for the simulator
        working-directory: ios/App
        run: |
          xcodebuild -scheme App \
            -destination 'generic/platform=iOS Simulator' \
            build CODE_SIGNING_ALLOWED=NO
