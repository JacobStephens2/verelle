[workspace]
members = [
    "crates/verelle-core",
    "crates/verelle-crypto",
    "crates/verelle-sync",
    "crates/verelle-store",
    "crates/verelle-cli",
    "crates/verelle-ffi",
    "crates/verelle-api",
    "crates/verelle-auth",
    "crates/verelle-server",
    "crates/verelle-web",
    "tools/uniffi-bindgen",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"

[workspace.dependencies]
aes-gcm = "0.10"
anyhow = "1"
argon2 = "0.5"
axum = "0.8.9"
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
csv = "1"
hkdf = "0.12"
leptos = "0.8.20"
opaque-ke = { version = "=4.0.1", features = ["argon2", "std"] }
p256 = { version = "0.13", features = ["ecdsa", "pkcs8"] }
proptest = "1"
rand = "0.8"
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
thiserror = "2"
tokio = "1"
tower = "0.5"
tracing = "0.1"
tracing-subscriber = "0.3"
uniffi = "=0.30.0"
uuid = { version = "1", features = ["serde", "v4"] }
zeroize = { version = "1", features = ["zeroize_derive"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
